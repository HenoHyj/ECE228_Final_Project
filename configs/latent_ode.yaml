name: latent_ode
model:
  type: latent_ode
  z_dim: 32                # bumped from 16: more capacity for 6 channels
  enc_hidden: 64           # bumped from 32
  ode_hidden: 64
  dec_hidden: 64           # MLP decoder width (was a single linear layer)
  ode_method: rk4          # fixed-step; step_size set from the grid so no 48h macro-step
  ode_substeps: 2          # rk4 substeps per output interval (accuracy)
  ode_gain: 0.5            # drift init gain (last layer stays small inside ODEFunc)
  rtol: 1.0e-3
  atol: 1.0e-4
  use_adjoint: true
  use_tidal_features: true  # feed sin/cos tidal clock to the decoder

data:
  interval: hourly
  history: 48
  horizon: 24
  stride: 6
  batch_size: 64
  num_workers: 0

train:
  epochs: 80
  lr: 1.0e-3
  weight_decay: 1.0e-4
  grad_clip: 0.5           # tightened from 1.0 after epoch-48 blowup
  early_stopping_patience: 10
  scheduler_patience: 4
  scheduler_factor: 0.5
  amp: false
  seed: 42
  warmup_epochs: 5          # linear LR warmup from lr/10 to lr
  input_dropout_train: 0.3  # random input dropout as data augmentation
  recon_weight: 0.5         # masked history-reconstruction loss (breaks mean collapse)
